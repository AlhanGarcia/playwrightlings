<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playwrightlings - Lesson 2: Forms</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f8fafc; }
    .form-container { background: white; padding: 24px; border-radius: 8px; max-width: 450px; border: 1px solid #e2e8f0; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input[type="text"], input[type="email"], select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
    #result { margin-top: 16px; padding: 12px; background: #f1f5f9; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>User Profile Form</h2>
    <form id="profile-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username">
      </div>
      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="student">Student</option>
          <option value="developer">Developer</option>
          <option value="tester">QA Tester</option>
        </select>
      </div>
      <div class="field">
        <label>
          <input type="checkbox" id="newsletter" name="newsletter"> Subscribe to newsletter
        </label>
      </div>
      <button type="submit" id="submit-btn">Save Profile</button>
    </form>
    <div id="result">Waiting for submission...</div>
  </div>
  <script>
    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const role = document.getElementById('role').value;
      const news = document.getElementById('newsletter').checked;
      document.getElementById('result').textContent = `Saved: ${user} | Role: ${role} | Newsletter: ${news}`;
    });
  </script>
</body>
</html>
