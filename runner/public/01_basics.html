<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playwrightlings - Lesson 1: Basics</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f4f6f8; color: #222; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; }
    button { padding: 10px 18px; font-size: 16px; border: none; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 16px; font-weight: bold; color: #059669; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="heading">Welcome to Playwright</h1>
    <p>This is your very first interactive testing page.</p>
    <button id="click-btn">Click Me</button>
    <p id="status">Button not clicked yet</p>
  </div>
  <script>
    document.getElementById('click-btn').addEventListener('click', () => {
      document.getElementById('status').textContent = 'Button was clicked!';
    });
  </script>
</body>
</html>
