<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playwrightlings - Lesson 9: Shop POM</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #fafafa; }
    .product-grid { display: flex; gap: 20px; }
    .product-card { background: white; padding: 16px; border-radius: 8px; border: 1px solid #ddd; width: 200px; }
    button { background: #16a34a; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    #cart-status { margin-top: 24px; padding: 16px; background: #e0f2fe; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Tech Gadgets Store</h2>
  <div class="product-grid">
    <div class="product-card" data-testid="product-keyboard">
      <h3>Mechanical Keyboard</h3>
      <p class="price">$80</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </div>
    <div class="product-card" data-testid="product-mouse">
      <h3>Wireless Mouse</h3>
      <p class="price">$45</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </div>
  </div>
  <div id="cart-status">
    <p>Cart Items: <span id="cart-count">0</span></p>
    <p>Total: $<span id="cart-total">0</span></p>
  </div>

  <script>
    let count = 0;
    let total = 0;
    document.querySelectorAll('.product-card').forEach(card => {
      const btn = card.querySelector('.add-to-cart-btn');
      const priceText = card.querySelector('.price').textContent.replace('$', '');
      const price = parseInt(priceText, 10);

      btn.addEventListener('click', () => {
        count++;
        total += price;
        document.getElementById('cart-count').textContent = count;
        document.getElementById('cart-total').textContent = total;
      });
    });
  </script>
</body>
</html>
