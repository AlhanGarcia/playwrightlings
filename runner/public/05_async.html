<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playwrightlings - Lesson 5: Async & Delays</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #fdfdfd; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    button { padding: 8px 16px; cursor: pointer; }
    #loaded-content { margin-top: 15px; padding: 10px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Asynchronous UI Playground</h2>
  <button id="fetch-btn">Fetch Data (takes 1.2s)</button>
  <div id="loading" class="hidden" style="margin-top: 10px;">
    <div class="spinner"></div> <span>Loading remote resource...</span>
  </div>
  <div id="loaded-content" class="hidden">
    <h3>Data Loaded Successfully!</h3>
    <p id="data-text">User records synchronized with cloud.</p>
  </div>

  <script>
    document.getElementById('fetch-btn').addEventListener('click', () => {
      const loader = document.getElementById('loading');
      const content = document.getElementById('loaded-content');
      loader.classList.remove('hidden');
      content.classList.add('hidden');

      setTimeout(() => {
        loader.classList.add('hidden');
        content.classList.remove('hidden');
      }, 1200);
    });
  </script>
</body>
</html>
