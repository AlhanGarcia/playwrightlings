<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playwrightlings - E2E Challenge 1</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 80vh; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 32px; border-radius: 12px; width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    input { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 16px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    .error { color: #f87171; font-size: 14px; margin-bottom: 12px; display: none; }
    #dashboard { display: none; }
  </style>
</head>
<body>
  <div class="card" id="login-card">
    <h2>Secure Portal Login</h2>
    <div id="error-msg" class="error">Invalid email or password</div>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="user@playwrightlings.io">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button id="login-button">Sign In</button>
  </div>

  <div class="card" id="dashboard">
    <h2>Welcome to the Dashboard!</h2>
    <p id="user-greeting">Logged in as: <span id="logged-email"></span></p>
    <button id="logout-button" style="background: #ef4444; margin-top: 20px;">Log Out</button>
  </div>

  <script>
    const loginCard = document.getElementById('login-card');
    const dashboard = document.getElementById('dashboard');
    const errorMsg = document.getElementById('error-msg');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');

    document.getElementById('login-button').addEventListener('click', () => {
      const email = emailInput.value.trim();
      const pass = passInput.value.trim();

      if (email === 'tester@playwrightlings.io' && pass === 'Secret123!') {
        errorMsg.style.display = 'none';
        loginCard.style.display = 'none';
        dashboard.style.display = 'block';
        document.getElementById('logged-email').textContent = email;
      } else {
        errorMsg.style.display = 'block';
      }
    });

    document.getElementById('logout-button').addEventListener('click', () => {
      dashboard.style.display = 'none';
      loginCard.style.display = 'block';
      passInput.value = '';
    });
  </script>
</body>
</html>
